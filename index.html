<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTR Bus 內建對照測試</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .status { padding: 10px; border-radius: 5px; margin-bottom: 20px; }
        .success { background-color: #d4edda; color: #155724; }
        .search-box { margin-bottom: 20px; }
        input, button { padding: 10px; font-size: 16px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        #result { border: 1px solid #ccc; padding: 15px; border-radius: 5px; min-height: 100px; background: #f9f9f9; line-height: 1.6; }
        .hint-list { font-size: 13px; color: #666; background: #eee; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>MTR 巴士站對照測試 (無外部檔案版)</h2>
    
    <!-- 永遠保持成功狀態，因為資料直接內建 -->
    <div id="status-bar" class="status success">✅ 對照表已成功內建載入！無需讀取任何外部 CSV 檔案。</div>

    <div class="search-box">
        <p>請輸入要測試的 <strong>busStopId</strong>：</p>
        <input type="text" id="stop-id-input" placeholder="輸入 ID，例如: K51-U100 或 510">
        <button onclick="testLookup()">立刻查詢</button>
    </div>

    <h4>查詢結果：</h4>
    <div id="result">尚未進行查詢</div>

    <br>
    <div class="hint-list">
        <strong>💡 可供測試的常用巴士站 ID 範例（可直接複製輸入）：</strong>
        <ul>
            <li><code>K51-U100</code> (屯門站)</li>
            <li><code>K51-D330</code> (富泰邨)</li>
            <li><code>510</code> (大欖)</li>
            <li><code>550</code> (屯門市中心)</li>
            <li><code>650</code> (兆康站北)</li>
            <li><code>710</code> (天水圍站)</li>
        </ul>
    </div>

    <script>
        // 直接將港鐵巴士的 CSV 核心數據轉換為 JavaScript 字典
        // 正式開發時，你可以把整份 CSV 轉成這種 JSON 格式放在這裡
        const busStopDictionary = {
            "K51-U100": { "nameTC": "屯門站", "nameEN": "Tuen Mun Station", "lng": "113.9741", "lat": "22.3948" },
            "K51-D330": { "nameTC": "富泰邨", "nameEN": "Fu Tai Estate", "lng": "113.9822", "lat": "22.4116" },
            "510": { "nameTC": "大欖", "nameEN": "Tai Lam", "lng": "114.0208", "lat": "22.3619" },
            "550": { "nameTC": "屯門市中心", "nameEN": "Tuen Mun Town Centre", "lng": "113.9754", "lat": "22.3924" },
            "650": { "nameTC": "兆康站北", "nameEN": "Siu Hong Station North", "lng": "113.9789", "lat": "22.4285" },
            "710": { "nameTC": "天水圍站", "nameEN": "Tin Shui Wai Station", "lng": "114.0042", "lat": "22.4449" },
            "740": { "nameTC": "天逸邨", "nameEN": "Tin Yat Estate", "lng": "113.9988", "lat": "22.4691" },
            "K58-U150": { "nameTC": "青山灣", "nameEN": "Castle Peak Bay", "lng": "113.9791", "lat": "22.3784" }
        };

        function testLookup() {
            const inputId = document.getElementById('stop-id-input').value.trim();
            const resultDiv = document.getElementById('result');

            if (!inputId) {
                resultDiv.innerHTML = "<span style='color:red;'>請輸入 busStopId！</span>";
                return;
            }

            // 在內建字典中搜尋
            const match = busStopDictionary[inputId];

            if (match) {
                resultDiv.innerHTML = `
                    <p><strong>巴士站 ID:</strong> <span style="color:#007bff;">${inputId}</span></p>
                    <p><strong>中文站名:</strong> <span style="color:green; font-size:20px; font-weight:bold;">${match.nameTC}</span></p>
                    <p><strong>英文站名:</strong> ${match.nameEN}</p>
                    <p><strong>經度 (Longitude):</strong> ${match.lng}</p>
                    <p><strong>緯度 (Latitude):</strong> ${match.lat}</p>
                    <p><small>🗺️ 地圖定位連結：<a href="https://google.com{match.lat},${match.lng}" target="_blank">在 Google Maps 中查看</a></small></p>
                `;
            } else {
                resultDiv.innerHTML = `<span style='color:red;'>找不到 ID 為 "${inputId}" 的車站。<br><small>提示：目前測試版僅內建了下方提示清單中的常用車站，請試試輸入 550 或 K51-U100。</small></span>`;
            }
        }
    </script>
</body>
</html>
