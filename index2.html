<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kindle 輕鐵及全港交通看板</title>
    <style>
        /* 專為 E-Ink (Kindle / Kobo / Onyx) 電子墨水屏設計的高對比純黑白樣式 */
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-width: 3px;
        }

        body {
            font-family: monospace, Arial, sans-serif;
            max-width: 650px;
            margin: 0 auto;
            padding: 10px;
            background: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
            -webkit-text-size-adjust: 100%;
        }

        /* 調整字型大小模式 */
        body.font-large { font-size: 1.2em; }
        body.font-xlarge { font-size: 1.4em; }

        .card {
            border: var(--border-width) solid #000000;
            padding: 12px;
            margin-bottom: 12px;
            background: #ffffff;
        }

        .header-title {
            margin: 0 0 10px 0;
            font-size: 1.3em;
            font-weight: bold;
            border-bottom: var(--border-width) solid #000000;
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clock-display {
            font-size: 0.85em;
            font-weight: normal;
        }

        label {
            font-size: 1em;
            font-weight: bold;
            display: block;
            margin-top: 8px;
            margin-bottom: 4px;
        }

        select, input, button {
            width: 100%;
            padding: 10px;
            margin: 4px 0 10px 0;
            border: 2px solid #000000;
            font-size: 1em;
            background: #ffffff;
            color: #000000;
            box-sizing: border-box;
            font-weight: bold;
            border-radius: 0;
            outline: none;
        }

        button {
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            touch-action: manipulation;
        }

        button:active, .tab-btn.active {
            background: #000000;
            color: #ffffff;
        }

        .row {
            display: flex;
            gap: 8px;
        }

        .row > * {
            flex: 1;
        }

        /* 標籤頁開關 */
        .tab-container {
            display: flex;
            border-bottom: 2px solid #000000;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 2px;
            margin: 0;
            border: 2px solid #000000;
            border-bottom: none;
            background: #ffffff;
            font-size: 0.88em;
            font-weight: bold;
            text-align: center;
            min-width: 22%;
        }

        /* 到站項目列表 */
        .platform-header {
            font-weight: bold;
            background: #000000;
            color: #ffffff;
            padding: 4px 8px;
            margin: 10px 0 4px 0;
            font-size: 0.95em;
        }

        .eta-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            border-bottom: 1px dashed #000000;
        }

        .eta-item:last-child {
            border-bottom: none;
        }

        .eta-dest {
            font-size: 0.95em;
            word-break: break-all;
        }

        .eta-time {
            font-size: 1.25em;
            font-weight: bold;
            text-align: right;
            white-space: nowrap;
        }

        .badge {
            border: 1px solid #000000;
            padding: 1px 4px;
            font-size: 0.8em;
            margin-right: 4px;
            font-weight: bold;
        }

        /* 常用收藏區域 */
        .favorites-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .fav-chip {
            border: 2px solid #000000;
            padding: 6px 10px;
            background: #ffffff;
            font-size: 0.85em;
            font-weight: bold;
            cursor: pointer;
        }

        .fav-chip:active {
            background: #000000;
            color: #ffffff;
        }

        /* Kindle 專用全螢幕閃爍 (清除殘影) */
        #flashOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 9999;
            display: none;
        }

        .info-bar {
            font-size: 0.8em;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
        }

        .status-msg {
            padding: 8px 0;
            font-size: 0.95em;
        }
    </style>
</head>

                    <option value="large">大字型 Large</option>

            </div>
        </div>
        <button onclick="triggerEInkRefresh()" style="margin-bottom:0;">⚡ 清除屏閃 (Clear E-Ink Ghosting)</button>
    </div>

        // 車站名稱解析輔助函式，防止顯示 undefined 或純代碼
        function getBusStopName(stop) {
            if (!stop) return "";
            var id = stop.busStopId || stop.id || "";
            if (id && MTR_BUS_NAME_LOOKUP[id]) {
                return MTR_BUS_NAME_LOOKUP[id];
            }
            if (stop.busStopName && stop.busStopName !== id) return stop.busStopName;
            if (stop.name && stop.name !== id) return stop.name;
            if (stop.busStopNameTC && stop.busStopNameTC !== id) return stop.busStopNameTC;
            if (id) {
                var dirStr = id.indexOf('-D') !== -1 ? '[去程] ' : (id.indexOf('-U') !== -1 ? '[回程] ' : '');
                return dirStr + "車站 (" + id + ")";
            }
            return "";
        }

        // 1. 輕鐵 API 邏輯
        function getLrtETA() {
            var stationId = document.getElementById('lrtStation').value;
            var resultDiv = document.getElementById('etaResult');
            var locationDiv = document.getElementById('displayLocationName');

            if (!stationId) {
                resultDiv.innerHTML = "請先選擇輕鐵車站。";
                return;
            }

            resultDiv.innerHTML = "連線中 (Fetching Light Rail)...";

            var apiUrl = "https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=" + stationId;

            fetch(apiUrl)
            .then(function(res) { return res.json(); })
            .then(function(data) {
                updateLastUpdated();
                var stnText = document.getElementById('lrtStation').options[document.getElementById('lrtStation').selectedIndex].text;
                locationDiv.innerText = "輕鐵 - " + stnText;

                if (data && data.platform_list && data.platform_list.length > 0) {
                    var html = "";
                    var hasData = false;

                    data.platform_list.forEach(function(platform) {
                        var platformId = platform.platform_id;
                        var routeList = platform.route_list || [];

                        if (routeList.length > 0) {
                            hasData = true;
                            html += "<div class='platform-header'>月台 " + platformId + " (Platform " + platformId + ")</div>";
                            
                            routeList.forEach(function(train) {
                                var routeNo = train.route_no || "";
                                var dest = train.dest_ch || train.dest_en || "";
                                var timeStr = train.time_ch || train.time_en || "即將抵達";
                                var lengthStr = train.train_length ? (" [" + train.train_length + "卡]") : "";

                                html += "<div class='eta-item'>";
                                html += "<div class='eta-dest'>";
                                html += "<span class='badge'>" + routeNo + "</span> 往 " + dest + lengthStr;
                                html += "</div>";
                                html += "<div class='eta-time'>" + timeStr + "</div>";
                                html += "</div>";
                            });
                        }
                    });

                    if (!hasData) {
                        resultDiv.innerHTML = "目前此站暫無預計到站輕鐵班次。";
                    } else {
                        resultDiv.innerHTML = html;
                    }
                } else {
                    resultDiv.innerHTML = "暫無輕鐵到站數據或車站代號有誤。";
                }
            })
            .catch(function(err) {
                console.error(err);
                resultDiv.innerHTML = "獲取輕鐵數據失敗，請檢查網絡連線。";
            });
        }

        // 2. 港鐵巴士 API 邏輯 (先渲染靜態列表，再非同步更新實時車站)
        function onMtrRouteChanged(targetStopIdToSelect) {
            var route = document.getElementById('mtrRoute').value;
            var stopSelect = document.getElementById('mtrStop');

            var currentVal = targetStopIdToSelect || localStorage.getItem('hk_mtr_stop') || 'K51-U210';

            // 第一步：先用離線預設資料瞬間填滿選單（使用中文名稱與方向）
            stopSelect.innerHTML = "";
            var staticList = MTR_BUS_STATIC_STOPS[route] || [
                { id: route + "-D010", name: "[去程] 起點站" },
                { id: route + "-U010", name: "[回程] 終點站" }
            ];

            staticList.forEach(function(s) {
                var opt = document.createElement('option');
                opt.value = s.id;
                opt.innerText = getBusStopName(s);
                if (currentVal && (s.id === currentVal || currentVal.indexOf(s.id) !== -1 || s.id.indexOf(currentVal) !== -1)) {
                    opt.selected = true;
                }
                stopSelect.appendChild(opt);
            });

            if (!targetStopIdToSelect) {
                saveAndFetchETA();
            }

            // 第二步：向 API 獲取最新的實時車站資料並補全選單
            var apiUrl = "https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule";

            fetch(apiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ language: "zh", routeName: route })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if ((data.status == 1 || data.status == "1" || data.busStop) && data.busStop && data.busStop.length > 0) {
                    var selectVal = targetStopIdToSelect || localStorage.getItem('hk_mtr_stop') || 'K51-U210';
                    stopSelect.innerHTML = "";
                    var matched = false;
                    data.busStop.forEach(function(stop) {
                        var opt = document.createElement('option');
                        opt.value = stop.busStopId;
                        opt.innerText = getBusStopName(stop);

                        var cleanVal = selectVal ? selectVal.replace(/^[A-Z0-9]+-/, '') : '';
                        if (selectVal && (stop.busStopId === selectVal || stop.busStopId === cleanVal || selectVal.indexOf(stop.busStopId) !== -1)) {
                            opt.selected = true;
                            matched = true;
                        }
                        stopSelect.appendChild(opt);
                    });

                    if (targetStopIdToSelect || matched) {
                        fetchETA();
                    }
                }
            })
            .catch(function(err) {
                console.log("MTR Bus stops loaded from local backup.");
                if (targetStopIdToSelect) fetchETA();
            });
        }

        function getMtrBusETA() {
            var route = document.getElementById('mtrRoute').value;
            var stopSelect = document.getElementById('mtrStop');
            var targetStopId = stopSelect.value;
            var resultDiv = document.getElementById('etaResult');
            var locationDiv = document.getElementById('displayLocationName');

            if (!targetStopId) {
                resultDiv.innerHTML = "請先選擇車站。";
                return;
            }

            resultDiv.innerHTML = "連線中 (Fetching MTR Bus)...";

            var apiUrl = "https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule";

            fetch(apiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ language: "zh", routeName: route })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                updateLastUpdated();
                var isOk = (data.status == 1 || data.status == "1" || data.status === true || (data.busStop && data.busStop.length > 0));

                if (isOk && data.busStop && data.busStop.length > 0) {
                    var targetStop = null;
                    var cleanTargetId = targetStopId.replace(/^[A-Z0-9]+-/, '');

                    for (var i = 0; i < data.busStop.length; i++) {
                        var s = data.busStop[i];
                        if (s.busStopId === targetStopId || 
                            s.busStopId === cleanTargetId || 
                            targetStopId.indexOf(s.busStopId) !== -1 || 
                            s.busStopId.indexOf(cleanTargetId) !== -1) {
                            targetStop = s;
                            break;
                        }
                    }

                    if (!targetStop && data.busStop.length > 0) {
                        targetStop = data.busStop[0];
                    }

                    var stopName = (stopSelect.selectedIndex >= 0 && stopSelect.options[stopSelect.selectedIndex]) 
                        ? stopSelect.options[stopSelect.selectedIndex].text 
                        : getBusStopName(targetStop);

                    if (!stopName || stopName === "undefined" || stopName.indexOf("K51-") !== -1) {
                        stopName = getBusStopName(targetStop) || getBusStopName({ busStopId: targetStopId }) || "車站";
                    }

                    locationDiv.innerText = "港鐵巴士 " + route + " - " + stopName;

                    var busList = targetStop.bus || targetStop.busIdList || targetStop.busList || [];

                    if (busList.length === 0) {
                        resultDiv.innerHTML = "目前此站 (" + stopName + ") 暫無預計到站班次<br><span style='font-size:0.85em; color:#555;'>(可能未到服務時間或班次尚未開出)</span>";
                        return;
                    }

                    var html = "";
                    busList.forEach(function(bus, idx) {
                        var driveNo = bus.busId || bus.driveNo || bus.busNo || ('班次 ' + (idx + 1));
                        var timeStr = bus.departureTimeText || bus.arrivalTimeText || bus.busTime || bus.time || bus.busDepartureTime || '即將抵達';
                        var remark = bus.busRemark ? (" [" + bus.busRemark + "]") : "";

                        html += "<div class='eta-item'>";
                        html += "<div><span class='badge'>班次 " + (idx + 1) + "</span> 車號: " + driveNo + remark + "</div>";
                        html += "<div class='eta-time'>" + timeStr + "</div>";
                        html += "</div>";
                    });
                    resultDiv.innerHTML = html;
                } else if (data.status == 0 || data.status == "0") {
                    resultDiv.innerHTML = "官方 API 提示：路線 " + route + " 目前非服務時間，或暫無班次數據。" + (data.message ? ("<br>(" + data.message + ")") : "");
                } else {
                    resultDiv.innerHTML = "API 回傳異常，暫無路線 " + route + " 數據。<br><span style='font-size:0.85em; color:#555;'>提示：請確認路線編號是否在服務時間內。</span>";
                }
            })
            .catch(function(err) {
                console.error(err);
                resultDiv.innerHTML = "網絡連線失敗，請檢查網路連線或稍後重試。";
            });
        }

        // 3. 九巴 API 邏輯
        function loadKmbStops() {
            var route = document.getElementById('kmbRoute').value.trim().toUpperCase();
            var bound = document.getElementById('kmbBound').value;
            var dir = (bound === 'outbound') ? 'outbound' : 'inbound';
            var stopSelect = document.getElementById('kmbStop');

            if (!route) return;
            stopSelect.innerHTML = "<option value=''>尋找路線中...</option>";

            fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/' + route + '/' + dir + '/1')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (!data.data || data.data.length === 0) {
                    stopSelect.innerHTML = "<option value=''>找不到該路線或方向</option>";
                    return;
                }

                var stopsData = data.data;
                stopSelect.innerHTML = "<option value=''>載入車站名稱中...</option>";

                fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop')
                .then(function(res) { return res.json(); })
                .then(function(stopRes) {
                    var stopDict = {};
                    if (stopRes.data) {
                        stopRes.data.forEach(function(s) { stopDict[s.stop] = s.name_tc; });
                    }

                    stopSelect.innerHTML = "";
                    stopsData.forEach(function(item) {
                        var opt = document.createElement('option');
                        opt.value = item.stop;
                        opt.innerText = item.seq + ". " + (stopDict[item.stop] || item.stop);
                        stopSelect.appendChild(opt);
                    });

                    // 自動對應預設車站 (例如 景峰花園 / TM294 或第 6 站)
                    var savedStop = localStorage.getItem('hk_kmb_stop');
                    var foundMatch = false;
                    if (savedStop) {
                        stopSelect.value = savedStop;
                        if (stopSelect.value === savedStop) foundMatch = true;
                    }
                    if (!foundMatch) {
                        for (var i = 0; i < stopSelect.options.length; i++) {
                            if (stopSelect.options[i].text.indexOf('景峰花園') !== -1 || stopSelect.options[i].text.indexOf('TM294') !== -1) {
                                stopSelect.selectedIndex = i;
                                foundMatch = true;
                                break;
                            }
                        }
                        if (!foundMatch && stopSelect.options.length >= 6) {
                            stopSelect.selectedIndex = 5; // 第 6 個車站
                        }
                    }

                    saveAndFetchETA();
                });
            })
            .catch(function(err) {
                stopSelect.innerHTML = "<option value=''>載入失敗</option>";
            });
        }

        function getKmbETA() {
            var route = document.getElementById('kmbRoute').value.trim().toUpperCase();
            var stopId = document.getElementById('kmbStop').value;
            var resultDiv = document.getElementById('etaResult');
            var locationDiv = document.getElementById('displayLocationName');

            if (!stopId) {
                resultDiv.innerHTML = "請先選擇九巴車站。";
                return;
            }

            resultDiv.innerHTML = "連線中 (Fetching KMB)...";

            fetch('https://data.etabus.gov.hk/v1/transport/kmb/eta/' + stopId + '/' + route + '/1')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                updateLastUpdated();
                if (data.data && data.data.length > 0) {
                    var stopText = document.getElementById('kmbStop').options[document.getElementById('kmbStop').selectedIndex].text;
                    locationDiv.innerText = "九巴 " + route + " - " + stopText;

                    var html = "";
                    var validCount = 0;

                    data.data.forEach(function(eta) {
                        if (eta.eta) {
                            validCount++;
                            var etaTime = new Date(eta.eta);
                            var timeStr = etaTime.toTimeString().split(' ')[0].substring(0, 5);
                            var diffMins = Math.round((etaTime - new Date()) / 60000);
                            var displayTime = diffMins <= 0 ? "即將抵達" : diffMins + " 分鐘 (" + timeStr + ")";

                            html += "<div class='eta-item'>";
                            html += "<div class='eta-dest'><span class='badge'>往</span>" + (eta.dest_tc || '') + "</div>";
                            html += "<div class='eta-time'>" + displayTime + "</div>";
                            html += "</div>";
                        }
                    });

                    resultDiv.innerHTML = validCount > 0 ? html : "目前沒有預計到站資料。";
                } else {
                    resultDiv.innerHTML = "暫無到站班次資料。";
                }
            })
            .catch(function(err) {
                resultDiv.innerHTML = "獲取九巴資料失敗。";
            });
        }

        // 4. 港鐵重鐵 API 邏輯
        function onTrainLineChanged(targetStation) {
            var line = document.getElementById('trainLine').value;
            var stationSelect = document.getElementById('trainStation');
            stationSelect.innerHTML = "";

            var defaultStation = targetStation || localStorage.getItem('hk_train_station') || (line === 'TML' ? 'SIH' : '');

            var list = TRAIN_STATIONS[line] || [];
            list.forEach(function(stn) {
                var opt = document.createElement('option');
                opt.value = stn.code;
                opt.innerText = stn.name;
                if (stn.code === defaultStation) {
                    opt.selected = true;
                }
                stationSelect.appendChild(opt);
            });

            saveAndFetchETA();
        }

        function getTrainETA() {
            var line = document.getElementById('trainLine').value;
            var sta = document.getElementById('trainStation').value;
            var resultDiv = document.getElementById('etaResult');
            var locationDiv = document.getElementById('displayLocationName');

            resultDiv.innerHTML = "連線中 (Fetching MTR Train)...";

            var url = "https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=" + line + "&sta=" + sta + "&lang=TC";

            fetch(url)
            .then(function(res) { return res.json(); })
            .then(function(data) {
                updateLastUpdated();
                if (data.status === 1) {
                    var key = line + "-" + sta;
                    var schedule = data.data[key];

                    var stnText = document.getElementById('trainStation').options[document.getElementById('trainStation').selectedIndex].text;
                    locationDiv.innerText = "港鐵 " + stnText;

                    if (!schedule) {
                        resultDiv.innerHTML = "目前暫無列車服務。";
                        return;
                    }

                    var html = "";
                    ['UP', 'DOWN'].forEach(function(dir) {
                        if (schedule[dir] && schedule[dir].length > 0) {
                            schedule[dir].forEach(function(item) {
                                var timeStr = item.time.split(' ')[1].substring(0, 5);
                                var ttnt = item.ttnt === "0" || item.ttnt === "1" ? "即將抵達" : item.ttnt + " 分鐘";

                                html += "<div class='eta-item'>";
                                html += "<div class='eta-dest'><span class='badge'>" + (dir === 'UP' ? '上行' : '下行') + "</span> 往 " + (item.dest || '') + " (月台 " + item.plat + ")</div>";
                                html += "<div class='eta-time'>" + ttnt + " (" + timeStr + ")</div>";
                                html += "</div>";
                            });
                        }
                    });

                    resultDiv.innerHTML = html || "暫無列車預報。";
                } else {
                    resultDiv.innerHTML = "港鐵 API 傳回系統訊息：" + (data.message || '無服務');
                }
            })
            .catch(function(err) {
                resultDiv.innerHTML = "無法取得港鐵重鐵資料。";
            });
        }

        // 核心調度器
        function fetchETA() {
            if (currentMode === 'lrt') getLrtETA();
            else if (currentMode === 'mtrbus') getMtrBusETA();
            else if (currentMode === 'kmb') getKmbETA();
            else if (currentMode === 'train') getTrainETA();
        }

        function saveAndFetchETA() {
            saveSettings();
            fetchETA();
        }

        function updateLastUpdated() {
            var now = new Date();
            document.getElementById('lastUpdated').innerText = now.toTimeString().split(' ')[0];
            document.getElementById('networkStatus').innerText = "狀態: 正常";
        }

        // 自動刷新計時器管理
        function resetRefreshTimer() {
            if (refreshTimer) clearInterval(refreshTimer);
            if (countdownTimer) clearInterval(countdownTimer);

            var intervalSec = parseInt(document.getElementById('autoRefreshInterval').value);
            if (intervalSec > 0) {
                countdownSeconds = intervalSec;
                document.getElementById('refreshCountdown').innerText = countdownSeconds + "s";

                countdownTimer = setInterval(function() {
                    countdownSeconds--;
                    if (countdownSeconds <= 0) {
                        countdownSeconds = intervalSec;
                        fetchETA();
                    }
                    document.getElementById('refreshCountdown').innerText = countdownSeconds + "s";
                }, 1000);
            } else {
                document.getElementById('refreshCountdown').innerText = "手動";
            }
        }

        function changeRefreshInterval() {
            saveSettings();
            resetRefreshTimer();
        }

        // 電子墨水屏專用全螢幕閃爍 (去除殘影)
        function triggerEInkRefresh() {
            var overlay = document.getElementById('flashOverlay');
            overlay.style.display = 'block';
            setTimeout(function() {
                overlay.style.background = '#ffffff';
                setTimeout(function() {
                    overlay.style.background = '#000000';
                    setTimeout(function() {
                        overlay.style.display = 'none';
                    }, 100);
                }, 100);
            }, 100);
        }

        function changeFontSize() {
            var sz = document.getElementById('fontSizeSelect').value;
            document.body.className = sz === 'normal' ? '' : 'font-' + sz;
            saveSettings();
        }

        // 收藏機制 (Favorites)
        function addFavorite() {
            var favs = JSON.parse(localStorage.getItem('hk_transit_favs') || '[]');
            var newItem = { mode: currentMode };

            if (currentMode === 'lrt') {
                newItem.station = document.getElementById('lrtStation').value;
                newItem.name = "輕鐵 " + document.getElementById('lrtStation').options[document.getElementById('lrtStation').selectedIndex].text;
            } else if (currentMode === 'mtrbus') {
                newItem.route = document.getElementById('mtrRoute').value;
                newItem.stopId = document.getElementById('mtrStop').value;
                var selElem = document.getElementById('mtrStop');
                var stopName = (selElem && selElem.selectedIndex >= 0 && selElem.options[selElem.selectedIndex]) 
                    ? selElem.options[selElem.selectedIndex].text 
                    : '車站';
                newItem.name = "港鐵巴士 " + newItem.route + " (" + stopName + ")";
            } else if (currentMode === 'kmb') {
                newItem.route = document.getElementById('kmbRoute').value.trim().toUpperCase();
                newItem.bound = document.getElementById('kmbBound').value;
                newItem.stopId = document.getElementById('kmbStop').value;
                newItem.name = "九巴 " + newItem.route + " (" + document.getElementById('kmbStop').options[document.getElementById('kmbStop').selectedIndex].text + ")";
            } else if (currentMode === 'train') {
                newItem.line = document.getElementById('trainLine').value;
                newItem.station = document.getElementById('trainStation').value;
                newItem.name = "重鐵 " + document.getElementById('trainStation').options[document.getElementById('trainStation').selectedIndex].text;
            }

            // 避免重複
            favs = favs.filter(function(f) { return f.name !== newItem.name; });
            favs.push(newItem);
            localStorage.setItem('hk_transit_favs', JSON.stringify(favs));
            renderFavorites();
        }

        function renderFavorites() {
            var favs = JSON.parse(localStorage.getItem('hk_transit_favs') || '[]');
            var container = document.getElementById('favoritesList');

            if (favs.length === 0) {
                container.innerHTML = "<span style='font-size:0.85em; color:#555;'>尚未添加常用車站。點擊「⭐ 收藏此站」加入。</span>";
                return;
            }

            container.innerHTML = "";
            favs.forEach(function(item, idx) {
                var chip = document.createElement('div');
                chip.className = 'fav-chip';
                chip.innerText = item.name;
                chip.onclick = function() { loadFavorite(item); };

                chip.title = "點擊載入，右鍵刪除";
                chip.oncontextmenu = function(e) {
                    e.preventDefault();
                    favs.splice(idx, 1);
                    localStorage.setItem('hk_transit_favs', JSON.stringify(favs));
                    renderFavorites();
                };

                container.appendChild(chip);
            });
        }

        function loadFavorite(item) {
            switchMode(item.mode);
            if (item.mode === 'lrt') {
                document.getElementById('lrtStation').value = item.station;
                fetchETA();
            } else if (item.mode === 'mtrbus') {
                document.getElementById('mtrRoute').value = item.route;
                onMtrRouteChanged(item.stopId);
            } else if (item.mode === 'kmb') {
                document.getElementById('kmbRoute').value = item.route;
                document.getElementById('kmbBound').value = item.bound;
                loadKmbStops();
                setTimeout(function() {
                    document.getElementById('kmbStop').value = item.stopId;
                    fetchETA();
                }, 1000);
            } else if (item.mode === 'train') {
                document.getElementById('trainLine').value = item.line;
                onTrainLineChanged();
                document.getElementById('trainStation').value = item.station;
                fetchETA();
            }
        }

        // 持久化記憶體讀取與儲存
        function saveSettings() {
            localStorage.setItem('hk_mode', currentMode);
            localStorage.setItem('hk_lrt_station', document.getElementById('lrtStation').value);
            localStorage.setItem('hk_mtr_route', document.getElementById('mtrRoute').value);
            localStorage.setItem('hk_mtr_stop', document.getElementById('mtrStop').value);
            localStorage.setItem('hk_kmb_route', document.getElementById('kmbRoute').value);
            localStorage.setItem('hk_kmb_bound', document.getElementById('kmbBound').value);
            localStorage.setItem('hk_kmb_stop', document.getElementById('kmbStop').value);
            localStorage.setItem('hk_train_line', document.getElementById('trainLine').value);
            localStorage.setItem('hk_train_station', document.getElementById('trainStation').value);
            localStorage.setItem('hk_refresh_int', document.getElementById('autoRefreshInterval').value);
            localStorage.setItem('hk_font_size', document.getElementById('fontSizeSelect').value);
        }

        function loadSettings() {
            if (localStorage.getItem('hk_mode')) switchMode(localStorage.getItem('hk_mode'));
            if (localStorage.getItem('hk_lrt_station')) document.getElementById('lrtStation').value = localStorage.getItem('hk_lrt_station');
            if (localStorage.getItem('hk_kmb_route')) document.getElementById('kmbRoute').value = localStorage.getItem('hk_kmb_route');
            if (localStorage.getItem('hk_kmb_bound')) document.getElementById('kmbBound').value = localStorage.getItem('hk_kmb_bound');
            if (localStorage.getItem('hk_train_line')) document.getElementById('trainLine').value = localStorage.getItem('hk_train_line');
            if (localStorage.getItem('hk_refresh_int')) document.getElementById('autoRefreshInterval').value = localStorage.getItem('hk_refresh_int');
            if (localStorage.getItem('hk_font_size')) {
                document.getElementById('fontSizeSelect').value = localStorage.getItem('hk_font_size');
                changeFontSize();
            }
        }
    </script>
</body>
</html>
